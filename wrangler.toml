name = "good-enough-italian-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Deploy with:  wrangler deploy
#
# Then set the two required secrets (run each command and paste the value when prompted):
#   wrangler secret put DEEPL_API_KEY
#   wrangler secret put AUTH_PASSWORD
#
# Copy the Worker URL shown after deploy and paste it into the app's Settings.

# KV namespace for cross-device list sync.
# Before deploying, run:  wrangler kv namespace create LISTS_KV
# Then replace the id below with the id printed by that command.
[[kv_namespaces]]
binding = "LISTS_KV"
id = "19d65fc7a3de46f7aef761190e06b4bb"
